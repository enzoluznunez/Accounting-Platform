AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  The NASBA financial ratios API: api.py on Lambda behind a Function URL,
  reading MongoDB Atlas. Deploy from pipeline/ with `sam build && sam deploy`.

Resources:
  NasbaApi:
    Type: AWS::Serverless::Function
    Metadata:
      # The Makefile packages the API's four files and requirements.txt, and
      # nothing else in this folder: no .env, no tests, no data pipeline.
      BuildMethod: makefile
    Properties:
      FunctionName: nasba-api
      CodeUri: .
      Handler: api.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      # Under the headset's own 10-second timeout, so a slow request fails here
      # with a reason in the log rather than there with none.
      Timeout: 9
      Environment:
        Variables:
          # Names of Parameter Store entries, not the secrets themselves;
          # database.setting reads them once per cold start.
          MONGODB_URI_PARAMETER: /nasba/mongodb-uri
          API_KEY_PARAMETER: /nasba/api-key
          MONGODB_DB: nasba
      Policies:
        # Read access to /nasba/* and nothing else in Parameter Store.
        - SSMParameterReadPolicy:
            ParameterName: nasba/*
      # A public HTTPS address. Anyone can reach it; api.py refuses everything
      # but /health without the key.
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogGroup: !Ref NasbaApiLogs

  # Declared rather than left to Lambda, which would keep logs forever.
  NasbaApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nasba-api
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Where the headset sends its requests; goes in StreamingAssets/api.url.
    Value: !GetAtt NasbaApiUrl.FunctionUrl
